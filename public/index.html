<script type="text/babel">
const VALID_ROCK_TYPES = ['igneous', 'sedimentary', 'metamorphic', 'mineral', 'meteorite', 'fossil', 'other'];

function normaliseMatch(m) {
  const rawType = (m.rock_type || '').toLowerCase();
  const rock_type = VALID_ROCK_TYPES.includes(rawType) ? rawType : 'other';
  const safetyLevel = (m.safety?.level || 'unknown').toLowerCase();
  const rock = {
    id: m.id || (m.common_name || m.name || 'unknown').toLowerCase().replace(/\s+/g, '-'),
    common: m.common_name || m.name || 'Unknown',
    scientific: m.scientific_name || '—',
    rock_type,
    sub_type: m.sub_type || '',
    classification: Array.isArray(m.classification) ? m.classification : [],
    tagline: m.tagline || '',
    description: m.description || m.tagline || '',
    formation: m.formation || '—',
    age_typical: m.age_typical || '—',
    composition: Array.isArray(m.composition) ? m.composition : [],
    texture: m.texture || '—',
    hardness: m.hardness || '—',
    diagnostic_tests: Array.isArray(m.diagnostic_tests) ? m.diagnostic_tests : [],
    safety: {
      level: ['safe', 'caution', 'hazardous'].includes(safetyLevel) ? safetyLevel : 'unknown',
      note: m.safety?.note || 'No handling notes.',
    },
    uses: m.uses || '—',
    tags: Array.isArray(m.tags) ? m.tags : [],
    similarDetail: Array.isArray(m.similar) ? m.similar.map(s => ({
      common: s.common_name || s.common || s.scientific_name || 'Unknown',
      name: s.scientific_name || s.name || '',
      differentiator: s.differentiator || s.why || '',
    })) : [],
  };
  return {
    rock,
    conf: typeof m.confidence === 'number' ? m.confidence : 0.5,
  };
}

function GeolyssaApp() {
  const [screen, setScreen] = React.useState('home');
  const [detailReturn, setDetailReturn] = React.useState('results');
  const [photoUrl, setPhotoUrl] = React.useState(null);
  const [matches, setMatches] = React.useState([]);
  const [macrostrat, setMacrostrat] = React.useState(null);
  const [activeRock, setActiveRock] = React.useState(null);
  const [journalEntries, setJournalEntries] = React.useState([]);
  const [journalLoaded, setJournalLoaded] = React.useState(false);
  const [activeJournalId, setActiveJournalId] = React.useState(null);
  const [tests, setTests] = React.useState({});
  const [toast, setToastRaw] = React.useState(null);
  const toastTimer = React.useRef(null);
  const setToast = (msg) => {
    setToastRaw(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastRaw(null), 3200);
  };

  const refreshJournal = React.useCallback(async () => {
    try {
      const list = await apiListEntries();
      setJournalEntries(list);
      setJournalLoaded(true);
    } catch (e) {
      console.error('[Geolyssa] journal load failed', e);
      setJournalLoaded(true);
      setToast(`Couldn't load journal: ${e.message}`);
    }
  }, []);

  React.useEffect(() => { refreshJournal(); }, [refreshJournal]);

  const recentCount = journalEntries.length;

  const [scanPart, setScanPart] = React.useState(null);
  const [rescanLoading, setRescanLoading] = React.useState(false);
  const captureCoordsPromise = React.useRef(null);
  const resolvedCoords = React.useRef(null);
  // All photos submitted in the current scan pipeline (primary + any extras
  // added from the results screen). A ref, not state — we only re-render
  // when the resulting matches change.
  const allPhotosRef = React.useRef([]);

  const startScan = (dataUrl, part) => {
    setPhotoUrl(dataUrl);
    setMatches([]);
    setMacrostrat(null);
    setScanPart(part || null);
    allPhotosRef.current = [{ dataUrl, part: part || 'whole' }];
    captureCoordsPromise.current = getGeoFresh().catch(() => null);
    setScreen('scan');
  };

  const onScanComplete = (data, coords) => {
    const normalised = (data.matches || []).map(normaliseMatch);
    setMatches(normalised);
    setMacrostrat(data.macrostrat || null);
    resolvedCoords.current = coords || null;
    setScreen('results');
  };

  // Called from ResultsScreen when the user adds a fresh-break photo or
  // fills in test results after a low-confidence verdict. Re-sends all
  // photos + accumulated context to /api/identify and updates matches.
  const rescanWithExtra = async ({ extraPhoto, newTests } = {}) => {
    setRescanLoading(true);
    try {
      if (extraPhoto) {
        allPhotosRef.current = [...allPhotosRef.current, extraPhoto];
      }
      const effectiveTests = newTests !== undefined ? newTests : tests;
      if (newTests !== undefined) setTests(newTests);

      let coords = resolvedCoords.current;
      if (!coords && captureCoordsPromise.current) {
        coords = await Promise.race([
          captureCoordsPromise.current,
          new Promise(r => setTimeout(() => r(null), 3000)),
        ]);
      }

      const res = await fetch('/api/identify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          images: allPhotosRef.current.map(p => ({ image: p.dataUrl, part: p.part })),
          coords: coords || undefined,
          tests: effectiveTests && Object.keys(effectiveTests).length ? effectiveTests : undefined,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Re-scan failed (${res.status})`);
      const normalised = (data.matches || []).map(normaliseMatch);
      setMatches(normalised);
      setMacrostrat(data.macrostrat || null);
      resolvedCoords.current = coords || resolvedCoords.current;
      setToast(extraPhoto ? 'Re-identified with new photo' : 'Re-identified with tests');
    } catch (e) {
      console.error('[Geolyssa] rescan failed', e);
      setToast(`Re-scan failed: ${e.message}`);
    } finally {
      setRescanLoading(false);
    }
  };

  const onScanError = (msg) => {
    alert('Sorry — ' + msg);
    setScreen('home');
  };

  const onSaveMatch = async (match) => {
    const date = new Date().toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const tempId = 'tmp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const optimistic = {
      id: tempId,
      rock: match.rock,
      rock_type: match.rock.rock_type || 'other',
      photoUrl,
      date,
      location: 'Captured here',
      coords: null,
      note: match.rock.tagline || '',
      _pending: true,
    };
    setJournalEntries(prev => [optimistic, ...prev]);
    setToast('Saving…');

    let coords = resolvedCoords.current;
    if (!coords && captureCoordsPromise.current) {
      try {
        coords = await Promise.race([
          captureCoordsPromise.current,
          new Promise(r => setTimeout(() => r(null), 5000)),
        ]);
      } catch { coords = null; }
    }

    const alternatives = matches
      .filter(m => m && m.rock && m.rock.id !== match.rock.id)
      .map(m => ({ rock: m.rock, conf: m.conf }));

    try {
      await apiSaveEntry({
        rock: match.rock,
        photoUrl,
        date,
        location: 'Captured here',
        coords,
        note: match.rock.tagline || '',
        alternatives,
        macrostrat,
      });
      await refreshJournal();
      setToast('Saved to journal');
    } catch (e) {
      console.error('[Geolyssa] save failed', e);
      setJournalEntries(prev => prev.filter(x => x.id !== tempId));
      setToast(`Couldn't save: ${e.message}`);
    }
  };

  const openDetail = (matchOrEntry) => {
    setActiveRock(matchOrEntry.rock);
    if (matchOrEntry.photoUrl) setPhotoUrl(matchOrEntry.photoUrl);
    const isJournalEntry = matchOrEntry.id && !String(matchOrEntry.id).startsWith('tmp-');
    setActiveJournalId(isJournalEntry ? matchOrEntry.id : null);
    setDetailReturn(screen);
    setScreen('detail');
  };

  const handleDeleteJournalEntry = async (id) => {
    await apiDeleteEntry(id);
    await refreshJournal();
    setActiveJournalId(null);
    setScreen(detailReturn || 'journal');
    setToast('Removed from journal');
  };

  const handleEntryUpdated = async (newRock) => {
    if (newRock) setActiveRock(newRock);
    await refreshJournal();
  };

  const activeEntry = React.useMemo(
    () => activeJournalId ? journalEntries.find(e => e.id === activeJournalId) : null,
    [activeJournalId, journalEntries]
  );

  const backFromDetail = () => setScreen(detailReturn || 'home');

  return (
    <div style={{ width: '100%', height: '100%' }}>
      {screen === 'home' && (
        <HomeScreen
          onCapture={startScan}
          onOpenJournal={() => setScreen('journal')}
          onOpenMap={() => setScreen('map')}
          onSelectEntry={openDetail}
          recentCount={recentCount}
          recentEntries={journalEntries.slice(0, 3)}
          tests={tests}
          setTests={setTests}
        />
      )}
      {screen === 'scan' && (
        <ScanScreen
          photoUrl={photoUrl}
          part={scanPart}
          coords={captureCoordsPromise.current}
          tests={tests}
          onComplete={onScanComplete}
          onError={onScanError}
        />
      )}
      {screen === 'results' && (
        <ResultsScreen
          photoUrl={photoUrl}
          matches={matches}
          macrostrat={macrostrat}
          tests={tests}
          rescanLoading={rescanLoading}
          extraCount={Math.max(0, allPhotosRef.current.length - 1)}
          onBack={() => setScreen('home')}
          onSelect={openDetail}
          onSave={onSaveMatch}
          onRescan={rescanWithExtra}
        />
      )}
      {screen === 'detail' && (
        <DetailScreen
          rock={activeRock}
          photoUrl={photoUrl}
          onBack={backFromDetail}
          journalId={activeJournalId}
          entry={activeEntry}
          onDelete={handleDeleteJournalEntry}
          onEntryUpdated={handleEntryUpdated}
          setToast={setToast}
        />
      )}
      {screen === 'journal' && (
        <JournalScreen
          entries={journalEntries}
          loaded={journalLoaded}
          onBack={() => setScreen('home')}
          onSelect={openDetail}
          onDeleted={refreshJournal}
          setToast={setToast}
        />
      )}
      {screen === 'map' && (
        <MapScreen
          entries={journalEntries}
          onBack={() => setScreen('home')}
          onSelect={openDetail}
        />
      )}
      {toast && (
        <div style={{
          position: 'fixed', left: '50%', bottom: 'calc(28px + env(safe-area-inset-bottom))',
          transform: 'translateX(-50%)',
          background: THEME.ink, color: '#fff',
          padding: '10px 16px', borderRadius: 999,
          fontSize: 13, fontWeight: 600,
          boxShadow: '0 8px 24px rgba(0,0,0,0.25)',
          maxWidth: '90%', textAlign: 'center',
          zIndex: 200, pointerEvents: 'none',
          animation: 'slideUp 180ms ease',
        }}>{toast}</div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<GeolyssaApp />);
</script>

</body>
</html>
